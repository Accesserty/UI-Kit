<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>au-carousel × Vue — i18n</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 48rem; margin: 2rem auto; padding: 0 1rem; }
    .demo-slide { border: 1px solid #ccc; border-radius: .5rem; padding: 1rem; }
    button { font-size: 1rem; padding: .4rem .8rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <h1>au-carousel × Vue — runtime i18n</h1>
  <p>The <code>data-*</code> i18n attributes are bound to a Vue locale ref. Vue needs
     <code>isCustomElement</code> so it treats <code>&lt;au-carousel&gt;</code> as a native element.</p>
  <div id="root"></div>

  <script type="module">
    // The esm-browser build includes the template compiler (needed for isCustomElement).
    import { createApp, ref, computed } from 'https://esm.sh/vue@3/dist/vue.esm-browser.js';
    import '../../dist/accesserty-ui-kit.min.js';

    const dict = {
      en: {
        prev: 'Previous slide', next: 'Next slide', pagination: 'Choose a slide',
        instructions: 'Use the arrow keys to move between slides.',
        dot: '{title}, {current} of {total}',
        slides: ['Coastal cliffs', 'City at dusk', 'Forest light'],
      },
      zh: {
        prev: '上一張', next: '下一張', pagination: '選擇投影片',
        instructions: '用方向鍵切換投影片。',
        dot: '{title},第 {current} / 共 {total}',
        slides: ['海岸', '城市黃昏', '森林光'],
      },
    };

    const app = createApp({
      setup() {
        const loc = ref('en');
        const t = computed(() => dict[loc.value]);
        const toggle = () => { loc.value = loc.value === 'en' ? 'zh' : 'en'; };
        const onChange = (e) => console.log('slide-change', e.detail);
        return { loc, t, toggle, onChange };
      },
      template: `
        <button id="toggle" @click="toggle">Locale: {{ loc }} (click to switch)</button>
        <au-carousel
          :data-text-prev="t.prev"
          :data-text-next="t.next"
          :data-text-pagination="t.pagination"
          :data-text-instructions="t.instructions"
          :data-dot-template="t.dot"
          @slide-change="onChange"
        >
          <div v-for="(s, i) in t.slides" :key="i" class="demo-slide" :data-title="s">
            <h3>{{ s }}</h3>
            <a :href="'#s' + i">Learn more about {{ s }}</a>
          </div>
        </au-carousel>`,
    });
    // Tell Vue that <au-*> are native custom elements, not Vue components.
    app.config.compilerOptions.isCustomElement = (tag) => tag.startsWith('au-');
    app.mount('#root');

    customElements.whenDefined('au-carousel').then(() => { window.__vueReady = true; });
  </script>
</body>
</html>
